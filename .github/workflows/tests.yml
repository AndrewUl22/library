name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run module tests inside the official Odoo image
        run: |
          docker run --rm \
            --network="host" \
            -e HOST=127.0.0.1 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v ${{ github.workspace }}:/mnt/extra-addons \
            odoo:19 \
            -d test_db -i library --test-enable --stop-after-init
